[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apple-silicon-inference-lab"
version = "0.1.0"
description = "Local LLM serving mechanics: admission control, scheduling, streaming and latency measurement, with capability-gated backends that refuse to report results they cannot produce."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
mac = ["mlx>=0.18", "mlx-lm>=0.19"]
plot = ["matplotlib>=3.8"]

[project.scripts]
asil = "asil.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asil"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
