name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Distributed experiments, 2 ranks
        run: torchrun --nproc_per_node=2 -m dtp.cli --out /tmp/ci-ws2.json
      - name: Distributed experiments, 4 ranks
        run: torchrun --nproc_per_node=4 -m dtp.cli --out /tmp/ci-ws4.json
